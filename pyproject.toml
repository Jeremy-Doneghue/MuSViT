[project]
name = "smt-foundationvision"
version = "0.1.0"
description = "MuSViT: a foundation vision model for sheet music representation"
readme = "README.md"
requires-python = ">=3.11.11"
dependencies = [
    "albumentations>=2.0.0",
    "augraphy>=8.2,<9",
    "cairosvg>=2.7.1",
    "datasets>=3.3.1",
    "dotenv>=0.9.9",
    "editdistance>=0.8.1",
    "fire>=0.7.0",
    "fonttools[woff]>=4.0",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=0.30.0",
    "lightning>=2.5.0.post0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "names>=0.3.0",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "peft>=0.13.0",
    "pillow>=12.0.0",
    "rich>=13.9.4",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "torch>=2.9.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.24.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "verovio==5.0.0",
    "wand>=0.6.13",
    "wandb>=0.22.2",
    "wonderwords>=2.2.0",
]

[project.scripts]
musvit = "musvit.cli:main"

[dependency-groups]
notebooks = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Build only the first-party packages; the experiment folders are plain
# directories, not auto-discoverable packages.
packages = ["musvit", "experiments"]

[tool.hatch.build.targets.sdist]
include = ["musvit", "experiments", "README.md", "pyproject.toml"]

[tool.uv]
package = true
